name: Deploy to Supabase (go live)

# Fully automated backend deploy: applies the DB schema (migrations), deploys
# every Edge Function, and sets the Gemini secret — all on a GitHub-hosted
# runner that HAS internet access. No local terminal needed.
#
# One-time setup (GitHub web UI → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – your project's database password
#   GEMINI_API_KEY         – a FRESHLY ROTATED Gemini key (server-side only)
# Optional:
#   SUPABASE_PROJECT_REF   – defaults to the project below if unset
#
# Then: Actions tab → "Deploy to Supabase (go live)" → Run workflow.
# (Claude can also trigger it for you once the secrets exist.)

on:
  workflow_dispatch:
  push:
    branches: [claude/read-files-build-app-rw8fqi]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'jlwmpyhiitgdklrbmxrh' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — required secrets present
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; missing=1; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Missing secret SUPABASE_DB_PASSWORD"; missing=1; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Missing secret GEMINI_API_KEY"; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required secrets present. Project ref: $PROJECT_REF"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database schema (migrations)
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          set -e
          for fn in ai-parse ocr transcribe nutrition; do
            echo "→ deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Set server-side secrets (Gemini)
        run: |
          supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF"
          supabase secrets set GEMINI_MODEL="gemini-2.0-flash" --project-ref "$PROJECT_REF"

      # ── Post-deploy verification: prove the DB + functions + secret are real ──
      - name: Verify database schema & RLS
        run: |
          set -e
          cat > /tmp/q.json <<'JSON'
          {"query":"select (to_regclass('public.study_courses') is not null and to_regclass('public.flashcards') is not null and to_regclass('public.meals') is not null and to_regclass('public.workouts') is not null and to_regclass('public.events') is not null and to_regclass('public.memory_nodes') is not null and to_regclass('public.analytics_events') is not null and to_regclass('public.tasks') is not null and to_regclass('public.journal_entries') is not null) as tables_ok, (select bool_and(relrowsecurity) from pg_class where relname in ('tasks','study_courses','meals','goals','habit_logs','shares','profiles') and relnamespace = 'public'::regnamespace) as rls_ok;"}
          JSON
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/q.json)
          echo "DB check response: $resp"
          tables_ok=$(echo "$resp" | jq -r 'if type=="array" then .[0].tables_ok else .tables_ok end')
          rls_ok=$(echo "$resp" | jq -r 'if type=="array" then .[0].rls_ok else .rls_ok end')
          if [ "$tables_ok" != "true" ]; then echo "::error::Schema verification failed — expected tables are missing"; exit 1; fi
          if [ "$rls_ok" != "true" ]; then echo "::error::RLS verification failed — row level security not enabled on all core tables"; exit 1; fi
          echo "DB OK: all expected tables exist and RLS is enabled."

      - name: Verify Edge Functions are deployed & active
        run: |
          set -e
          fns=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Functions response: $fns"
          fail=0
          for fn in ai-parse ocr transcribe nutrition; do
            status=$(echo "$fns" | jq -r --arg s "$fn" '[.[] | select(.slug == $s)][0].status // "MISSING"')
            echo "  $fn → $status"
            if [ "$status" = "MISSING" ]; then echo "::error::Function $fn was not deployed"; fail=1; fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "Functions OK: ai-parse, ocr, transcribe, nutrition all deployed."

      - name: Verify Gemini secret is set
        run: |
          set -e
          secs=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if echo "$secs" | jq -e 'any(.[]; .name == "GEMINI_API_KEY")' >/dev/null; then
            echo "Secret OK: GEMINI_API_KEY is set (value hidden)."
          else
            echo "::error::GEMINI_API_KEY secret is not set on the project"; exit 1
          fi

      # Optional live smoke test — only runs if you also add SUPABASE_ANON_KEY.
      - name: Smoke-test ai-parse (optional)
        if: ${{ env.SUPABASE_ANON_KEY != '' }}
        run: |
          code=$(curl -sS -o /tmp/fn.json -w "%{http_code}" \
            -X POST "https://$PROJECT_REF.functions.supabase.co/ai-parse" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            --data '{"text":"عندي امتحان بكرة الساعة ٩"}')
          echo "ai-parse HTTP $code"; cat /tmp/fn.json || true
          if [ "$code" != "200" ]; then echo "::error::ai-parse did not return 200"; exit 1; fi
          echo "Live invoke OK."

      - name: Summary
        if: always()
        run: |
          {
            echo "### ✅ Life OS backend deploy";
            echo "- Schema pushed (migrations 0001 + 0002) — verified tables exist + RLS on";
            echo "- Edge Functions: ai-parse, ocr, transcribe, nutrition — verified active";
            echo "- Gemini secret set (server-side only) — verified present";
          } >> "$GITHUB_STEP_SUMMARY"
