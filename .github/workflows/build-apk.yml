name: Build Android APK

# Builds an installable Android APK on a GitHub runner (which has the Android
# SDK), then uploads it as a downloadable artifact. No signing secrets needed:
# Expo's generated build.gradle signs the RELEASE variant with the standard
# debug keystore, so it installs on any device (enable "Install unknown apps").
#
# Why release and not debug: a debug APK does NOT embed the JS bundle — it
# loads it from a Metro dev server at runtime, so on a standalone phone it
# installs but crashes instantly on launch. The release variant embeds
# index.android.bundle inside the APK (self-contained).
#
# Run: Actions tab → "Build Android APK" → Run workflow.
# (Committing this file also kicks off the first build.)
# Download: open the finished run → Artifacts → "life-os-apk".

on:
  workflow_dispatch:
  push:
    branches: [claude/read-files-build-app-rw8fqi]
    paths:
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write real env for the bundle
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Give Gradle enough memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build release APK (self-contained, debug-keystore signed)
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk life-os.apk

      # Guard against the "installs but crashes on launch" class of failure:
      # the APK must carry its own JS bundle to run without a Metro server.
      - name: Verify JS bundle is embedded
        run: unzip -l life-os.apk | grep -q "assets/index.android.bundle"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-os-apk
          path: life-os.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### 📦 Life OS APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from this run's **Artifacts → life-os-apk**." >> "$GITHUB_STEP_SUMMARY"
          echo "Self-contained release build (JS bundle embedded) — installs and runs on any Android device." >> "$GITHUB_STEP_SUMMARY"
