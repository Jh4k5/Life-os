name: Diagnose APK launch

# Builds the release APK, then actually LAUNCHES it on an Android emulator and
# captures logcat around startup. This reproduces "installs but instantly
# crashes / keeps stopping" and prints the real native/JS stack trace, so we
# stop guessing. Run: Actions → "Diagnose APK launch" → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [claude/read-files-build-app-rw8fqi]
    paths:
      - '.github/workflows/diagnose-apk.yml'

concurrency:
  group: diagnose-apk
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Env for the bundle (public Supabase values)
        run: cp .env.example .env

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Give Gradle enough memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk life-os.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: android-emulator-runner runs this script LINE BY LINE (each
          # line is its own `sh -c`), so multi-line for/if blocks break and
          # shell vars do NOT persist across lines. Every line below is fully
          # self-contained; the pid capture + verdict share one line, and the
          # poll loop is a single physical line. State that must survive between
          # lines goes to a file (/tmp/logcat_full.txt).
          script: |
            adb logcat -b all -c || true
            adb logcat -b all > /tmp/logcat_full.txt &
            adb install -r life-os.apk
            adb shell am start -W -n com.liveos.app/.MainActivity || true
            for i in $(seq 1 20); do echo "t=$((i*2))s pid='$(adb shell pidof com.liveos.app 2>/dev/null)'"; sleep 2; done
            echo "==== app JS log (last 80) ====" ; grep -E "ReactNativeJS|LIFEOS-CRASH" /tmp/logcat_full.txt | tail -80 || true
            echo "==== fatals / signals / tombstones ====" ; grep -E "LIFEOS-CRASH|FATAL EXCEPTION|AndroidRuntime|F DEBUG|F libc|signal |SIGSEGV|SIGABRT|abort message|tombstone|has died|Force finishing|ExceptionsManager|redbox|libhermes|UnsatisfiedLink|dlopen|TurboModule" /tmp/logcat_full.txt | tail -200 || true
            echo "==== tombstones on device ====" ; adb shell "ls -la /data/tombstones/ 2>/dev/null; cat /data/tombstones/* 2>/dev/null" | head -140 || true
            P="$(adb shell pidof com.liveos.app 2>/dev/null)" ; [ -z "$P" ] && echo "APP-STATUS: CRASHED (no live process after launch)" || echo "APP-STATUS: RUNNING (pid $P)"

      - name: Upload full logcat + APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-artifacts
          path: |
            /tmp/logcat_full.txt
            life-os.apk
          if-no-files-found: warn
          retention-days: 30
